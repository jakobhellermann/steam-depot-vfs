[package]
name = "steam-depot-mount"
version.workspace = true
edition.workspace = true

[features]
default = []
# FUSE back end. Needs a kernel that speaks FUSE, so in practice linux —
# `fuser`'s pure-rust mount path is used, no libfuse needed. Enabling it
# on macOS gets you a type-check but no working mount.
fuse = ["dep:fuser", "dep:libc"]
# Loopback NFSv3 back end, mounted with the platform NFS client.
# The back end does networking, so it needs tokio's net driver.
nfs = ["dep:nfsserve", "dep:async-trait", "dep:libc", "tokio/net", "tokio/process"]

[dependencies]
bytes.workspace = true
parking_lot = "0.12.5"
steam-depot-vfs = { path = "../steam-depot-vfs" }
steam-vent-depot.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "signal"] }
tracing.workspace = true

async-trait = { version = "0.1.92", optional = true }
# `macos-no-mount` only affects `fuser`'s macOS branch, where it skips
# the macFUSE pkg-config probe; the linux build ignores it.
fuser = { version = "0.17.0", optional = true, features = ["macos-no-mount"] }
libc = { version = "0.2.186", optional = true }
nfsserve = { version = "0.11.0", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

# A dev tool, but also what the crash-recovery test kills -9.
[[bin]]
name = "nfs-demo"
required-features = ["nfs"]
